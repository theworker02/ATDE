name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: |
          VERSION=$(cat VERSION)
          go build -ldflags="-s -w -X main.version=${VERSION}" -o bin/atde ./cmd/atde
          ./bin/atde -version
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atde-linux-amd64
          path: bin/atde
