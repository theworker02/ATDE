name: Feature request
description: Propose a defensive capability or operator improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ATDE is defensive-only. Requests for third-party flooding, stolen-token abuse, or unauthorized interference will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: checkboxes
    id: legal
    attributes:
      label: Scope confirmation
      options:
        - label: This feature stays within owned-infrastructure / legitimate abuse channels
          required: true
