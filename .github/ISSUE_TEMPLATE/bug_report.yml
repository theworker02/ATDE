name: Bug report
description: Report a defect in ATDE
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping harden ATDE. Do **not** include production secrets or real attacker PII beyond what is needed to reproduce.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.3.0 / git SHA"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode / component
      options:
        - honeypot
        - deception
        - active / edge containment
        - CT / extract / enrich
        - publish / sinkhole
        - docs / packaging
        - other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
